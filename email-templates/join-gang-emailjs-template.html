<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>New Join Gang submission</title>
  </head>
  <body style="margin:0;padding:0;background:#f7f7f8;font-family:Helvetica,Arial,sans-serif;color:#111;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center" style="padding:28px 16px;">
          <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(17,24,39,0.08);">
            <tr>
              <td style="padding:20px 24px;background:linear-gradient(90deg,#f59e0b, #f97316);">
                <table width="100%" role="presentation">
                  <tr>
                    <td style="vertical-align:middle;">
                      <img src="https://your-site.com/images/tea-gang-logo.svg" alt="Tea Gang" width="130" style="display:block;border:0;" />
                    </td>
                    <td style="text-align:right;vertical-align:middle;color:#fff;font-weight:700;font-size:16px;">New Join Gang submission</td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding:24px 28px;">
                <h2 style="margin:0 0 8px 0;font-size:20px;color:#0f172a;">A new member wants to join the Gang</h2>
                <p style="margin:0 0 18px 0;color:#334155;font-size:14px;line-height:1.4;">Below are the details submitted via the site form.</p>

                <table width="100%" cellpadding="6" cellspacing="0" role="presentation" style="border-collapse:collapse;margin-top:8px;">
                  <tr>
                    <td style="width:28%;font-weight:600;color:#0f172a;border-bottom:1px solid #eef2f7;">Name</td>
                    <td style="border-bottom:1px solid #eef2f7;color:#0f172a;">{{name}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight:600;color:#0f172a;border-bottom:1px solid #eef2f7;">Email</td>
                    <td style="border-bottom:1px solid #eef2f7;color:#0f172a;">{{email}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight:600;color:#0f172a;border-bottom:1px solid #eef2f7;">Phone</td>
                    <td style="border-bottom:1px solid #eef2f7;color:#0f172a;">{{number}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight:600;color:#0f172a;">Location</td>
                    <td style="color:#0f172a;">{{location}}</td>
                  </tr>
                </table>

                <p style="margin:20px 0 0 0;color:#475569;font-size:13px;">You can reply to this email to follow up with the new member. — Tea Gang</p>
              </td>
            </tr>

            <tr>
              <td style="padding:16px 24px;background:#f8fafc;color:#94a3b8;font-size:12px;text-align:center;">© Tea Gang — All rights reserved</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
